<!DOCTYPE html>
<html lang="es-ES">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CAFETEO & TARDEO | Tenerife Elite</title>
    <style>
        /* RESTAURANDO TU DISEÑO ORIGINAL NEGRO Y DORADO */
        :root {
            --bg-color: #0B0B0B;
            --primary-gold: #C6A75C;
            --card-bg: #141414;
            --text-white: #FFFFFF;
        }
        body { background-color: var(--bg-color); color: var(--text-white); font-family: 'Segoe UI', sans-serif; margin: 0; padding-bottom: 50px; }
        header { padding: 40px 20px; text-align: center; }
        .logo { font-size: 32px; color: var(--primary-gold); font-weight: bold; letter-spacing: 5px; text-transform: uppercase; }
        .subtitle { font-size: 14px; color: #888; letter-spacing: 3px; text-transform: uppercase; margin-top: 10px; }
        
        .filter-container { padding: 0 10px 20px; max-width: 1200px; margin: 0 auto; }
        .main-filters { display: flex; gap: 5px; margin-bottom: 10px; }
        .filter-btn { flex: 1; padding: 15px; border: 1px solid #333; background: transparent; color: var(--primary-gold); font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .filter-btn.active { border-color: var(--primary-gold); background: rgba(198, 167, 92, 0.1); }
        
        .zone-label { padding: 10px; font-size: 14px; color: #fff; }
        select { width: 100%; padding: 12px; background: #1a1a1a; color: #fff; border: 1px solid #333; border-radius: 0; appearance: none; }

        .locales-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; padding: 20px; }
        .locale-card { background: var(--card-bg); border-radius: 8px; overflow: hidden; border: 1px solid #222; }
        .card-media-container { position: relative; height: 200px; background: #000; display: flex; align-items: center; justify-content: center; }
        .card-img { width: 100%; height: 100%; object-fit: cover; opacity: 0.7; }
        
        .play-icon { position: absolute; width: 50px; height: 50px; background: rgba(198, 167, 92, 0.8); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        
        .card-content { padding: 20px; border-top: 1px solid #222; }
        .card-title { color: var(--primary-gold); font-size: 20px; margin: 0 0 5px 0; text-transform: lowercase; font-variant: small-caps; }
        .card-zone { color: #888; font-size: 14px; margin-bottom: 15px; }
        
        .btn-maps { display: block; width: 100%; padding: 12px; background: transparent; border: 1px solid #333; color: var(--primary-gold); text-align: center; text-decoration: none; font-weight: bold; font-size: 13px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <header>
        <div class="logo">CAFETEO & TARDEO</div>
        <div class="subtitle">TENERIFE ELITE SELECTION</div>
    </header>

    <div class="filter-container">
        <div class="main-filters">
            <button id="cafeteoBtn" class="filter-btn">CAFETEO</button>
            <button id="tardeoBtn" class="filter-btn">TARDEO</button>
        </div>
        <div class="zone-label" id="currentZoneLabel">Adeje</div>
        <select id="zoneFilter">
            <option value="all">Todas las zonas</option>
        </select>
    </div>

    <div id="localesGrid" class="locales-grid"></div>

    <script>
        let localesData = [];
        let filters = { cafeteo: false, tardeo: false, zone: 'all' };

        async function cargar() {
            try {
                const res = await fetch('datos.json');
                const data = await res.json();
                localesData = Array.isArray(data) ? data : (data.locales || []);
                
                // Llenar selector de zonas
                const zonas = [...new Set(localesData.map(l => l.municipio))].filter(Boolean).sort();
                zonas.forEach(z => {
                    const opt = document.createElement('option');
                    opt.value = z; opt.textContent = z;
                    document.getElementById('zoneFilter').appendChild(opt);
                });

                render();
            } catch (e) { console.error("Error cargando el pan de cada día:", e); }
        }

        function render() {
            const grid = document.getElementById('localesGrid');
            grid.innerHTML = '';

            const filtrados = localesData.filter(l => {
                const matchZ = filters.zone === 'all' || l.municipio === filters.zone;
                const matchC = !filters.cafeteo || (l.cafeteo === 'SI' || l.categoria === 'cafeteo');
                const matchT = !filters.tardeo || (l.tardeo === 'SI' || l.categoria === 'tardeo');
                return matchZ && matchC && matchT;
            });

            filtrados.forEach(l => {
                const card = document.createElement('div');
                card.className = 'locale-card';
                // REPARACIÓN DE "UNDEFINED": Busca cualquier nombre posible en tu JSON
                const nombre = l.nombre_oficial || l.nombre || "Local sin nombre";
                const imagen = l.foto || l.imagen || "";
                
                card.innerHTML = `
                    <div class="card-media-container">
                        ${imagen ? `<img src="${imagen}" class="card-img">` : ''}
                        <div class="play-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="black"><path d="M8 5v14l11-7z"/></svg></div>
                    </div>
                    <div class="card-content">
                        <h3 class="card-title">${nombre}</h3>
                        <p class="card-zone">${l.municipio || ''}</p>
                        <a href="${l.ver_en_maps || '#'}" target="_blank" class="btn-maps">VER EN MAPS</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Eventos de botones (tus rectángulos dorados)
        document.getElementById('cafeteoBtn').onclick = function() {
            filters.cafeteo = !filters.cafeteo;
            this.classList.toggle('active');
            render();
        };
        document.getElementById('tardeoBtn').onclick = function() {
            filters.tardeo = !filters.tardeo;
            this.classList.toggle('active');
            render();
        };
        document.getElementById('zoneFilter').onchange = function(e) {
            filters.zone = e.target.value;
            document.getElementById('currentZoneLabel').textContent = e.target.value === 'all' ? 'Todas las zonas' : e.target.value;
            render();
        };

        cargar();
    </script>
</body>
</html>
