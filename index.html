<!DOCTYPE html>
<html lang="es-ES">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>C&T - Tenerife Elite</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #C6A75C !important; --bg: #0B0B0B; --card: #111111; --red: #ff0000 !important; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding-bottom: 50px; }
        
        /* CABECERA REALMENTE ENTERA */
        .hero-header img { width: 100%; height: auto !important; display: block; border-bottom: 2px solid var(--gold); }
        .welcome-msg { text-align: center; font-size: 22px; margin: 20px 0; font-weight: 300; }

        .zone-container { padding: 0 20px 20px; text-align: center; }
        select { width: 100%; max-width: 400px; padding: 15px; background: #1a1a1a; color: #fff; border: 1px solid var(--gold); border-radius: 8px; outline: none; }

        .filters { display: flex; justify-content: center; gap: 10px; padding: 10px 20px; }
        .filter-btn { flex: 1; max-width: 150px; padding: 15px; border: 1px solid var(--gold); background: transparent; color: var(--gold); font-weight: bold; border-radius: 5px; cursor: pointer; }
        .filter-btn.active { background: var(--gold); color: #000; }

        .locales-grid { padding: 15px; display: grid; gap: 40px; }
        .card { background: var(--card); border-radius: 15px; overflow: hidden; border: 1px solid #222; text-align: center; }
        .media-container { height: 450px; background: #000; cursor: pointer; position: relative; }
        .card-img { width: 100%; height: 100%; object-fit: cover; }
        .card-video { width: 100%; height: 100%; object-fit: contain; }

        .card-body { padding: 25px 20px; }
        .card-name { color: var(--gold); font-size: 26px; margin: 0; text-transform: uppercase; }
        .ritual-box { margin: 10px 0; color: var(--gold); font-style: italic; font-size: 14px; }
        
        /* HORARIO CON RELOJ DORADO */
        .horario-status { color: var(--gold); font-weight: bold; font-size: 16px; margin-bottom: 5px; }
        .horario-full { font-size: 11px; color: #888; margin-bottom: 25px; }
        .fa-clock { color: var(--gold) !important; margin-right: 5px; }

        .main-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 25px; }
        .action-icon { background: #1a1a1a; color: var(--gold); padding: 18px; border-radius: 10px; border: 1px solid #333; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; }

        /* AMENITIES CORREGIDOS - LOGICA DE X Y DORADO */
        .amenities-row { display: flex; justify-content: space-around; padding-top: 20px; border-top: 1px solid #222; }
        .amenity { flex: 1; display: flex; flex-direction: column; align-items: center; min-height: 110px; }
        .gold-circle { width: 40px; height: 40px; border: 1.5px solid var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--gold); margin-bottom: 5px; font-size: 16px; font-weight: bold; }
        
        .status-box { height: 25px; display: flex; align-items: center; justify-content: center; width: 100%; }
        .p-dot { font-size: 18px; line-height: 1; }
        .cross-x { color: var(--red) !important; font-size: 22px; font-weight: 900; }
        .gold-spec { color: var(--gold) !important; font-size: 8px; font-weight: 800; text-transform: uppercase; }

        .amenity-label { font-size: 9px; color: var(--gold) !important; font-weight: bold; text-transform: uppercase; margin: 0; text-align: center; }

        .reserva-info { color: var(--gold); font-size: 13px; font-weight: bold; margin: 15px 0; border: 1px dashed var(--gold); padding: 10px; border-radius: 5px; }
        .insta-btn { color: var(--gold); font-size: 14px; text-decoration: none; display: block; border: 1px solid var(--gold); padding: 12px; border-radius: 8px; font-weight: bold; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="hero-header">
    <img src="https://res.cloudinary.com/di1ehofjb/image/upload/v1773239936/Principal_FOTO_wwrubd.jpg" alt="Header">
</div>

<div class="welcome-msg">¿A dónde vamos hoy?</div>

<div class="zone-container">
    <select id="zoneFilter"><option value="all">Todas las zonas</option></select>
</div>

<div class="filters">
    <button id="cafeteoBtn" class="filter-btn">Cafeteo</button>
    <button id="tardeoBtn" class="filter-btn">Tardeo</button>
</div>

<div id="localesGrid" class="locales-grid"></div>

<script>
    let localesData = [];
    let activeF = { cafeteo: false, tardeo: false, zone: 'all' };

    async function init() {
        try {
            const res = await fetch('datos.json?v=' + Date.now()); // Forzar lectura de JSON nuevo
            const data = await res.json();
            localesData = Array.isArray(data) ? data : (data.locales || []);
            
            const zonas = [...new Set(localesData.map(l => l.municipio))].filter(Boolean).sort();
            zonas.forEach(z => {
                const opt = document.createElement('option');
                opt.value = z; opt.textContent = z;
                document.getElementById('zoneFilter').appendChild(opt);
            });
            render();
        } catch(e) { console.error("Error", e); }
    }

    function render() {
        const grid = document.getElementById('localesGrid');
        grid.innerHTML = '';

        const filtered = localesData.filter(l => {
            const mZ = activeF.zone === 'all' || l.municipio === activeF.zone;
            const mC = !activeF.cafeteo || (l.categoria === 'cafeteo' || l.cafeteo === 'SI');
            const mT = !activeF.tardeo || (l.categoria === 'tardeo' || l.tardeo === 'SI');
            return mZ && mC && mT;
        });

        filtered.forEach((l, i) => {
            const card = document.createElement('div');
            card.className = 'card';

            // Parking
            let pColor = '#f1c40f'; 
            if(l.parking_tipo === 'facil') pColor = '#2ecc71';
            if(l.parking_tipo === 'dificil') pColor = '#e74c3c';
            let pText = String(l.parking || '').replace(/\(.*\)/g, '').replace(/fácil|difícil|depende/gi, '').trim();

            // Terraza: X o Espectacular
            let terraHtml = '';
            if(l.terraza === 'NO') {
                terraHtml = '<span class="cross-x">X</span>';
            } else if(l.terraza_detalle && l.terraza_detalle.includes('icon-sombrilla-2')) {
                terraHtml = '<span class="gold-spec">ESPECTACULAR</span>';
            }

            // Perros: X
            let perroHtml = (l.perros === 'NO') ? '<span class="cross-x">X</span>' : '';

            card.innerHTML = `
                <div class="media-container" onclick="playV(${i})">
                    <img src="${l.foto || l.imagen}" class="card-img" id="img-${i}">
                    <video src="${l.video}" class="card-video hidden" id="vid-${i}" onended="stopV(${i})" playsinline></video>
                </div>
                <div class="card-body">
                    <h2 class="card-name">${l.nombre_oficial || l.nombre}</h2>
                    <div class="ritual-box">⭐ ${l.ritual || ''}</div>
                    <div class="horario-status">${l.abierto === 'SI' ? 'ABIERTO Ahora' : 'CERRADO'}</div>
                    <div class="horario-full"><i class="far fa-clock"></i> ${l.horario || ''}</div>

                    <div class="main-actions">
                        <div class="action-icon" onclick="callApp('${l.telefono}')"><i class="fas fa-phone"></i></div>
                        <div class="action-icon" onclick="waApp('${l.whatsapp}')"><i class="fab fa-whatsapp"></i></div>
                        <a href="${l.ver_en_maps ? l.ver_en_maps.replace('place/', 'dir//') : '#'}" class="action-icon" target="_blank"><i class="fas fa-directions"></i></a>
                    </div>

                    <div class="amenities-row">
                        <div class="amenity">
                            <div class="gold-circle">P</div>
                            <div class="status-box"><span class="p-dot" style="color:${pColor}">●</span></div>
                            <p class="amenity-label">${pText}</p>
                        </div>
                        <div class="amenity">
                            <div class="gold-circle"><i class="fas fa-universal-access"></i></div>
                            <div class="status-box"></div>
                            <p class="amenity-label">${l.acceso || 'ACCESO'}</p>
                        </div>
                        <div class="amenity">
                            <div class="gold-circle"><i class="fas fa-credit-card"></i></div>
                            <div class="status-box"></div>
                            <p class="amenity-label">TARJETA</p>
                        </div>
                        <div class="amenity">
                            <div class="gold-circle"><i class="fas fa-umbrella-beach"></i></div>
                            <div class="status-box">${terraHtml}</div>
                            <p class="amenity-label">TERRAZA</p>
                        </div>
                        <div class="amenity">
                            <div class="gold-circle"><i class="fas fa-dog"></i></div>
                            <div class="status-box">${perroHtml}</div>
                            <p class="amenity-label">PERROS</p>
                        </div>
                    </div>

                    ${l.reserva ? `<div class="reserva-info">RESERVA: ${l.reserva}</div>` : ''}
                    <a href="${l.instagram}" class="insta-btn" target="_blank">VER INSTAGRAM</a>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function callApp(n) {
        if(!n || n === 'undefined' || n === '') alert('TELÉFONO NO DISPONIBLE');
        else window.location.href = 'tel:' + String(n).replace(/\s+/g, '');
    }
    function waApp(n) {
        if(!n || n === 'undefined' || n === '') alert('WHATSAPP NO DISPONIBLE');
        else window.open('https://wa.me/' + String(n).replace(/\s+/g, ''), '_blank');
    }
    function playV(i) {
        const v = document.getElementById('vid-'+i); const im = document.getElementById('img-'+i);
        if(!v.src || v.src.includes('undefined')) return;
        im.classList.add('hidden'); v.classList.remove('hidden'); v.play();
    }
    function stopV(i) {
        const v = document.getElementById('vid-'+i); const im = document.getElementById('img-'+i);
        v.classList.add('hidden'); im.classList.remove('hidden');
    }

    document.getElementById('zoneFilter').onchange = (e) => { activeF.zone = e.target.value; render(); };
    document.getElementById('cafeteoBtn').onclick = function() { activeF.cafeteo = !activeF.cafeteo; activeF.tardeo = false; render(); };
    document.getElementById('tardeoBtn').onclick = function() { activeF.tardeo = !activeF.tardeo; activeF.cafeteo = false; render(); };

    init();
</script>
</body>
</html>
