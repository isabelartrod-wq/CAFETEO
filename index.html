<!DOCTYPE html>

<head>

<style>
:root {
--bg-color: #0B0B0B;
--card-bg: #1a1a1a;
--primary-gold: #C6A75C;
--secondary-gold: #D4B86D;
--accent-gold: #E5C158;
--text-white: #FFFFFF;
--text-gray: #CCCCCC;
--text-muted: #888888;
--border-color: rgba(198, 167, 92, 0.3);
--shadow-color: rgba(198, 167, 92, 0.15);
--open-color: #4CAF50;
--closed-color: #F44336;
--font-main: 'Montserrat', sans-serif;
--transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
* {
box-sizing: border-box;
margin: 0;
padding: 0;
-webkit-tap-highlight-color: transparent;
-webkit-font-smoothing: antialiased;
-moz-osx-font-smoothing: grayscale;
}
body {
background-color: var(--bg-color);
color: var(--text-white);
font-family: var(--font-main);
overflow-x: hidden;
padding-bottom: 70px;
min-height: 100vh;
}
/* --- HERO SECTION --- */
.hero-container {
position: relative;
width: 100vw;
height: 45vh;
min-height: 350px;
overflow: hidden;
}
.hero-image {
width: 100%;
height: 100%;
object-fit: cover;
object-position: top;
}
.hero-overlay {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: linear-gradient(180deg, rgba(11,11,11,0.3) 0%, rgba(11,11,11,0.9) 100%);
}
/* --- ACTION BUTTONS --- */
.action-buttons-container {
display: flex;
justify-content: center;
gap: 12px;
padding: 24px 20px 10px;
flex-wrap: wrap;
}
.action-btn {
display: flex;
align-items: center;
gap: 10px;
padding: 16px 32px;
border-radius: 30px;
font-size: 14px;
font-weight: 600;
letter-spacing: 1.2px;
text-transform: uppercase;
cursor: pointer;
transition: var(--transition-smooth);
border: 1.5px solid;
background: rgba(198, 167, 92, 0.08);
position: relative;
overflow: hidden;
}
.action-btn::before {
content: '';
position: absolute;
top: 0;
left: -100%;
width: 100%;
height: 100%;
background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
transition: left 0.5s ease;
}
.action-btn:hover::before {
left: 100%;
}
.action-btn.cafeteo {
color: var(--primary-gold);
border-color: rgba(198, 167, 92, 0.4);
}
.action-btn.cafeteo.active {
background: linear-gradient(135deg, rgba(198, 167, 92, 0.25), rgba(198, 167, 92, 0.15));
border-color: var(--primary-gold);
box-shadow: 0 0 20px rgba(198, 167, 92, 0.3);
transform: translateY(-2px);
}
.action-btn.tardeo {
color: var(--secondary-gold);
border-color: rgba(212, 175, 55, 0.4);
}
.action-btn.tardeo.active {
background: linear-gradient(135deg, rgba(212, 175, 55, 0.25), rgba(212, 175, 55, 0.15));
border-color: var(--secondary-gold);
box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
transform: translateY(-2px);
}
.action-btn:hover {
transform: translateY(-2px);
box-shadow: 0 8px 25px rgba(198, 167, 92, 0.2);
}
.action-btn .btn-icon svg {
width: 20px;
height: 20px;
stroke: currentColor;
fill: none;
stroke-width: 2;
stroke-linecap: round;
stroke-linejoin: round;
}
/* --- WELCOME TEXT --- */
.welcome-text {
text-align: center;
font-size: 26px;
font-weight: 500;
color: var(--text-white);
margin: 28px 0 18px;
letter-spacing: 0.3px;
text-transform: none;
}
/* --- ZONE FILTER --- */
.zone-filter-container {
display: flex;
justify-content: center;
padding: 0 20px 35px;
}
.zone-filter-wrapper {
position: relative;
width: 90%;
max-width: 420px;
}
.zone-filter-icon {
position: absolute;
left: 18px;
top: 50%;
transform: translateY(-50%);
font-size: 18px;
color: var(--primary-gold);

pointer-events: none;
}
.zone-filter-select {
width: 100%;

background: rgba(255, 255, 255, 0.97);
border: 1.5px solid var(--primary-gold);
border-radius: 14px;
font-size: 15px;
font-weight: 600;
color: #0B0B0B;
cursor: pointer;
box-shadow: 0 4px 25px rgba(198, 167, 92, 0.25);
appearance: none;
transition: var(--transition-smooth);
}
.zone-filter-select:focus {
outline: none;

border-color: var(--accent-gold);
}
.zone-filter-arrow {
position: absolute;
right: 18px;

height: 12px;

border-bottom: 2px solid var(--primary-gold);

transition: var(--transition-smooth);
}
/* --- INITIAL MESSAGE --- */

color: var(--text-muted);
font-size: 14px;

/* --- LOCALES GRID --- */
.locales-grid {
display: grid;
grid-template-columns: 1fr;
gap: 24px;

}
.locale-card {

border-radius: 16px;
overflow: hidden;
border: 1px solid var(--border-color);

transition: var(--transition-smooth);
}
.locale-card:hover {

}
@keyframes slideUp {

to { opacity: 1; transform: translateY(0); }

}

justify-content: center;

.card-content {

}
/* ✅ CORRECCIÓN 1: Nombre del local en color dorado */
.card-title {

.card-ritual .ritual-label {

.card-horario-status {
display: flex;
align-items: center;

}
.card-horario-status svg {

.card-horario-status.open {

.reserva-btn {
width: 100%;
padding: 12px;
border-radius: 10px;
border: 1px solid var(--primary-gold);
background: rgba(198, 167, 92, 0.1);
color: var(--primary-gold);
font-size: 13px;
font-weight: 600;
cursor: pointer;
transition: var(--transition-smooth);

}
.reserva-btn:hover {
background: rgba(198, 167, 92, 0.25);
border-color: var(--accent-gold);
}
.instagram-btn {
width: 100%;
padding: 12px;
border-radius: 10px;
border: 1px solid var(--primary-gold);
background: rgba(198, 167, 92, 0.1);
color: var(--primary-gold);
font-size: 13px;
font-weight: 500;
cursor: pointer;
transition: var(--transition-smooth);

align-items: center;
justify-content: center;
gap: 6px;

.instagram-btn:hover {
background: rgba(198, 167, 92, 0.25);
border-color: var(--accent-gold);

}
.instagram-btn svg {
width: 18px;
height: 18px;
fill: currentColor;
}
/* --- REPORT BUTTON --- */
.report-btn {
width: 100%;
padding: 10px;
border-radius: 8px;
border: 1px dashed var(--border-color);
background: transparent;
color: var(--text-muted);
font-size: 11px;
font-weight: 400;
cursor: pointer;
transition: var(--transition-smooth);
display: flex;
align-items: center;
justify-content: center;
gap: 6px;
margin-top: 12px;
}

border-color: var(--primary-gold);
color: var(--primary-gold);
background: rgba(198, 167, 92, 0.05);
}
.report-btn svg {
width: 14px;

fill: currentColor;

/* --- VIDEO MODAL --- */
.video-modal {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(0, 0, 0, 0.96);
z-index: 1000;
display: none;
align-items: center;
justify-content: center;
animation: fadeIn 0.3s ease;
backdrop-filter: blur(8px);
}
.video-modal.active {
display: flex;
}
@keyframes fadeIn {
from { opacity: 0; }
to { opacity: 1; }
}
.video-modal-content {
width: 92%;
max-width: 700px;
position: relative;
}
.video-modal video {
width: 100%;
border-radius: 16px;
box-shadow: 0 10px 50px rgba(0,0,0,0.5);
}
.video-close-btn {
position: absolute;
top: -50px;
right: 0;
background: transparent;
border: none;
color: var(--text-white);
font-size: 36px;
cursor: pointer;
padding: 5px;
transition: var(--transition-smooth);
opacity: 0.8;
}
.video-close-btn:hover {
opacity: 1;
color: var(--primary-gold);
}
/* --- BOTTOM NAVIGATION --- */
.bottom-nav {
position: fixed;
bottom: 0;
left: 0;
width: 100%;
background: var(--bg-color);
border-top: 1px solid var(--border-color);
display: flex;
justify-content: center;
padding: 12px 0;
z-index: 100;
}
.nav-item {
display: flex;
flex-direction: column;
align-items: center;
gap: 5px;
padding: 8px 24px;
cursor: pointer;

}
.nav-item.active {

}
.nav-item.inactive {

}
.nav-icon {

}
.nav-item.active .nav-icon {

}
.nav-label {
font-size: 11px;
font-weight: 500;

}
/* --- RESPONSIVE --- */
@media (min-width: 768px) {
.locales-grid {
grid-template-columns: repeat(2, 1fr);
max-width: 900px;
}
}
/* --- LOADING STATE --- */
.loading-container {
display: flex;
justify-content: center;
align-items: center;

}
.loading-spinner {
width: 44px;
height: 44px;
border: 2px solid var(--border-color);
border-top-color: var(--primary-gold);

animation: spin 0.8s linear infinite;
}
@keyframes spin {
to { transform: rotate(360deg); }
}
/* --- HIDDEN ELEMENTS --- */
.hidden {
display: none !important;
}
</style>
</head>

<script>
// --- STATE ---
let localesData = [];
let activeFilters = { cafeteo: false, tardeo: false, zone: 'all' };
// --- DOM ELEMENTS ---
const cafeteoBtn = document.querySelector('.action-btn.cafeteo');
const tardeoBtn = document.querySelector('.action-btn.tardeo');
const zoneFilter = document.getElementById('zoneFilter');
const initialMessage = document.getElementById('initialMessage');
const localesGrid = document.getElementById('localesGrid');
const loadingContainer = document.getElementById('loadingContainer');
const videoModal = document.getElementById('videoModal');
const videoPlayer = document.getElementById('videoPlayer');
const videoCloseBtn = document.getElementById('videoCloseBtn');
// --- CARGAR DATOS DESDE JSON ---
function cargarDatos() {
fetch('datos.json')
.then(response => {
if (!response.ok) {
throw new Error('Error al cargar datos.json');
}
return response.json();
})
.then(data => {
localesData = data;
console.log('✅ Datos cargados:', localesData.length, 'locales');
populateZoneFilter();
initialMessage.classList.add('hidden');
filterLocales();
})
.catch(error => {
console.error('❌ Error:', error);
initialMessage.textContent = 'Error al cargar los locales. Verifica que el archivo datos.json exista.';
initialMessage.classList.remove('hidden');
});
}
// --- GENERAR FILTRO DE ZONAS AUTOMÁTICAMENTE ---
function populateZoneFilter() {
const uniqueZones = [...new Set(localesData.map(locale => locale.municipio))].sort();
zoneFilter.innerHTML = '<option value="all">Todas las zonas</option>';
uniqueZones.forEach(zone => {
if (zone && zone.trim() !== '') {
const option = document.createElement('option');
option.value = zone;
option.textContent = zone;
zoneFilter.appendChild(option);
}
});
}
// --- FUNCIONES ---
function generateMapsUrl(coordenadas) {
const cleanCoords = coordenadas.replace(/\s/g, '');
return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(cleanCoords)}`;
}
function capitalizeFirst(str) {
if (!str) return '';
return str.charAt(0).toUpperCase() + str.slice(1);
}
function cleanParentheses(str) {
if (!str) return '';
return str.replace(/\(|\)/g, '').trim();
}
// ✅ CORRECCIÓN 4: Horario inteligente con hora real
function getTodaySchedule(horario) {
const dayAbbr = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
const today = new Date().getDay();
const todayAbbr = dayAbbr[today];
const now = new Date();
const currentHour = now.getHours();
const currentMinutes = now.getMinutes();
const currentTime = currentHour * 60 + currentMinutes;
const regex = new RegExp(`${todayAbbr}[:\\s]*([^/]+)(?:/|$)`, 'i');
const match = horario.match(regex);
if (match) {
const schedule = match[1].trim();
if (schedule.toLowerCase().includes('cerrado')) {
return 'Cerrado';
}
const timeMatch = schedule.match(/(\d{1,2}):(\d{2})-(\d{1,2}):(\d{2})/);
if (timeMatch) {
const openHour = parseInt(timeMatch[1]) * 60 + parseInt(timeMatch[2]);
const closeHour = parseInt(timeMatch[3]) * 60 + parseInt(timeMatch[4]);
if (currentTime >= openHour && currentTime <= closeHour) {
return schedule;
} else {
return 'Cerrado';
}
}
return schedule;
}
return 'Consultar horario';
}
function isOpenToday(horario) {
const schedule = getTodaySchedule(horario);
return !schedule.toLowerCase().includes('cerrado');
}
function getTerrazaLabel(terraza) {
if (!terraza) return '';
if (terraza.includes('❌') || terraza.includes('X')) return 'X';
const umbrellas = (terraza.match(/☂️/g) || []).length;
if (umbrellas >= 2) return 'Espectacular';
if (umbrellas === 1) return 'Con terraza';
return '';
}
function getPerrosLabel(perros) {
if (!perros) return '';
if (perros.includes('❌') || perros.includes('X')) return 'X';
return 'Sí';
}
function createLocaleCard(locale) {
const card = document.createElement('div');
card.className = 'locale-card';
card.dataset.id = locale.id;
const hasVideo = locale.video && locale.video.trim() !== '';
const mapsUrl = generateMapsUrl(locale.coordenadas);
const todaySchedule = getTodaySchedule(locale.horario);
const open = isOpenToday(locale.horario);
const terrazaLabel = getTerrazaLabel(locale.terraza);
const perrosLabel = getPerrosLabel(locale.perros);
const showReserva = locale.reserva && !locale.reserva.toLowerCase().includes('no');
card.innerHTML = `
<div class="card-media-container" data-video="${hasVideo ? locale.video : ''}">
<img src="${locale.foto}" alt="${locale.nombre_oficial}" class="card-media" loading="lazy">
${hasVideo ? `
<div class="play-button-overlay">
<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
</div>
` : ''}
</div>
<div class="card-content">
<h3 class="card-title">${locale.nombre_oficial}</h3>
<p class="card-ritual">
<span class="ritual-label">Ritual:</span> ${capitalizeFirst(locale.ritual)} ⭐
</p>
<div class="card-horario-status ${open ? 'open' : 'closed'}">
<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
<span>${open ? '🟢 ABIERTO' : '🔴 CERRADO'} ${todaySchedule !== 'Consultar horario' ? '- ' + todaySchedule : ''}</span>
</div>

const mediaContainer = card.querySelector('.card-media-container');
mediaContainer.addEventListener('click', function() {
const videoUrl = this.dataset.video;
if (videoUrl) openVideoModal(videoUrl);
});
return card;
}
// --- GLOBAL FUNCTIONS FOR BUTTONS ---
function openMaps(url) { window.open(url, '_blank'); }
function openPhone(phone) { window.location.href = `tel:${phone}`; }
function openWhatsApp(phone) { const cleanPhone = phone.replace('+', '').replace(/\s/g, ''); window.open(`https://wa.me/${cleanPhone}`, '_blank'); }
function openInstagram(url) { window.open(url, '_blank'); }
function openReport(localeName) {
const reportEmail = 'info@cyt-tenerife.com';
const subject = encodeURIComponent(`Reporte de error - ${localeName}`);
const body = encodeURIComponent(`Reportar error en: ${localeName}\nPor favor, describe el error encontrado:`);
window.open(`mailto:${reportEmail}?subject=${subject}&body=${body}`, '_blank');
}
function filterLocales() {
loadingContainer.classList.remove('hidden');
localesGrid.classList.add('hidden');
initialMessage.classList.add('hidden');
setTimeout(() => {
const filtered = localesData.filter(locale => {
let passes = true;
if (activeFilters.cafeteo && locale.cafeteo !== 'SI') passes = false;
if (activeFilters.tardeo && locale.tardeo !== 'SI') passes = false;
if (activeFilters.zone !== 'all' && locale.municipio !== activeFilters.zone) passes = false;
return passes;
});
const uniqueFiltered = filtered.filter((locale, index, self) =>
index === self.findIndex(l => l.id === locale.id)
);
loadingContainer.classList.add('hidden');
if (uniqueFiltered.length === 0) {
initialMessage.textContent = 'No se encontraron locales con estos filtros';
initialMessage.classList.remove('hidden');
} else {
localesGrid.innerHTML = '';
uniqueFiltered.forEach(locale => {
localesGrid.appendChild(createLocaleCard(locale));
});
localesGrid.classList.remove('hidden');
}
}, 300);
}
function openVideoModal(videoUrl) {
videoPlayer.src = videoUrl;
videoModal.classList.add('active');
videoPlayer.play().catch(e => console.log('Video autoplay:', e));
}
function closeVideoModal() {
videoModal.classList.remove('active');
videoPlayer.pause();
videoPlayer.src = '';
}
// --- EVENT LISTENERS ---
cafeteoBtn.addEventListener('click', function() {
activeFilters.cafeteo = !activeFilters.cafeteo;
this.classList.toggle('active');
if (activeFilters.cafeteo) {
activeFilters.tardeo = false;
tardeoBtn.classList.remove('active');
}
filterLocales();
});
tardeoBtn.addEventListener('click', function() {
activeFilters.tardeo = !activeFilters.tardeo;
this.classList.toggle('active');
if (activeFilters.tardeo) {
activeFilters.cafeteo = false;
cafeteoBtn.classList.remove('active');
}
filterLocales();
});
zoneFilter.addEventListener('change', function() {
activeFilters.zone = this.value;
filterLocales();
});
videoCloseBtn.addEventListener('click', closeVideoModal);
videoModal.addEventListener('click', function(e) {
if (e.target === videoModal) closeVideoModal();
});
videoPlayer.addEventListener('ended', function() {
closeVideoModal();
});
// --- INIT ---
document.addEventListener('DOMContentLoaded', function() {
console.log('🚀 C&T Elite PWA initialized');
cargarDatos();
});
</script>
